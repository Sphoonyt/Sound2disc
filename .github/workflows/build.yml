name: Build Sound2Disc

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: Sound2Disc-${{ github.sha }}
          path: build/libs/Sound2Disc-*.jar
          retention-days: 30
