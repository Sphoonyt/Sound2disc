# Sound2Disc Configuration

# Port for the built-in resource pack HTTP server
# Make sure this port is open/forwarded if players are joining remotely
resource-pack-port: 8765

# Optional: Override the server IP used in the resource pack URL
# Leave empty to auto-detect
server-ip: ""

# Maximum duration allowed for a sound file (in seconds)
max-duration-seconds: 300

# OGG conversion quality (0-10, higher = better quality / larger file)
ogg-quality: 6

# Distance in blocks at which the jukebox custom sound can be heard
jukebox-sound-range: 65.0

# Custom disc item display name (use & for color codes)
disc-name-format: "&b✦ Custom Disc &7[&f%name%&7]"
